<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#C05A3F" />
    <title>ZANGO is offline</title>
    <style>
      :root{color-scheme:light;background:#fcf9f5;color:#3e2723;font-family:Fira Sans,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}.card{max-width:460px;border:1px solid #e5d5c5;background:#fff;border-radius:28px;padding:32px;box-shadow:0 24px 70px rgba(62,39,35,.14);text-align:center}.mark{width:82px;height:82px;border-radius:24px;margin:0 auto 18px;background:#c05a3f;display:grid;place-items:center;color:#fcf9f5;font:700 32px Georgia,serif}h1{font-family:Georgia,serif;font-size:32px;margin:0 0 10px}p{line-height:1.6;color:#7a6b5d;margin:0 0 22px}.btn{appearance:none;border:0;border-radius:999px;background:#c05a3f;color:#fcf9f5;font-weight:700;padding:12px 20px;cursor:pointer}.hint{font-size:13px;margin-top:16px}
    </style>
  </head>
  <body>
    <section class="card" aria-labelledby="offline-title">
      <div class="mark" aria-hidden="true">Z</div>
      <h1 id="offline-title">You’re offline</h1>
      <p>ZANGO can still open cached pages you’ve visited. Connect to the internet to refresh marketplace listings, contact sellers, or complete account actions.</p>
      <button class="btn" type="button" onclick="window.location.reload()">Try again</button>
      <p class="hint">This page will recover automatically when your connection returns.</p>
    </section>
    <script>window.addEventListener('online',()=>window.location.reload())</script>
  </body>
</html>
